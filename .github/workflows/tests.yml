name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  protected-check-route:
    name: Protected Check Route
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      product: ${{ steps.route.outputs.product }}
      gui: ${{ steps.route.outputs.gui }}
      reason: ${{ steps.route.outputs.reason }}
      head: ${{ steps.route.outputs.head }}
      tree: ${{ steps.route.outputs.tree }}
      diff_sha256: ${{ steps.route.outputs.diff_sha256 }}
    env:
      ROUTER_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || '') }}
      ROUTER_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.ROUTER_HEAD }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Derive fail-closed protected-check route
        id: route
        shell: pwsh
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "protected-check-route.json"
          $forceReal = @()
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $forceReal = @('--force-real')
          }
          python tools/repo_hygiene/protected_check_router.py `
            --repo-root . `
            --base "$env:ROUTER_BASE" `
            --head "$env:ROUTER_HEAD" `
            --receipt $receipt `
            --github-output $env:GITHUB_OUTPUT `
            @forceReal

      - name: Upload protected-check route receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: protected-check-route-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/protected-check-route.json
          if-no-files-found: error
          retention-days: 30

  repo-hygiene-python:
    name: Repo Hygiene Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Install repo hygiene test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/pip.txt
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/repo-hygiene.txt
          python -m pip check

      - name: Run repo hygiene Python tests
        run: |
          # Directory target: a new tools/repo_hygiene/test_*.py file is collected
          # automatically, unlike the per-file list this replaced. A named-file
          # inclusion list silently omits every file it forgets to name.
          python -m unittest discover -s tools/repo_hygiene -p "test_*.py" -t . -v
          python -m unittest tools.release.test_release_evidence -v
          python -m unittest tools.gates.test_output_budget -v
          python -m tools.repo_hygiene.pipeline_golden_provenance --repo-root .
          python -m tools.repo_hygiene.vendored_native_payloads --repo-root .
          python tools/repo-hygiene/hygiene.py --repo-root . verify-policy

      - name: Check pinned instruction tokens
        run: python tools/docs/check_pinned_tokens.py

      - name: Run coordination and self-healing guardrails
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pytest `
            tools\coordination\test_coordination_guardrails.py `
            tests\coordination `
            -q

      - name: Run demote-factory-bridge refusal-path tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pytest `
            tools\coordination\test_demote_factory_bridge.py `
            -q

      - name: Verify generated Python dependency locks
        if: runner.os == 'Windows'
        run: |
          python -m venv "$env:RUNNER_TEMP\python-lock-tools"
          & "$env:RUNNER_TEMP\python-lock-tools\Scripts\python.exe" -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/lock-tools.txt
          & tools\dependencies\update-python-locks.ps1 -RepoRoot . -Python "$env:RUNNER_TEMP\python-lock-tools\Scripts\python.exe" -Check

  windows-product-oracles:
    name: Windows Product Oracles
    needs: protected-check-route
    if: ${{ always() && !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

    env:
      QT_VERSION: 6.10.2
      QT_OUTPUT_DIR: ${{ github.workspace }}\qt
      EXPECTED_ROUTE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Fail closed on unavailable product route
        if: ${{ needs.protected-check-route.result != 'success' || (needs.protected-check-route.outputs.product != 'true' && needs.protected-check-route.outputs.product != 'false') }}
        run: |
          throw "protected-check route unavailable or product output malformed"

      - name: Validate exact product route binding
        run: |
          $route = '${{ needs.protected-check-route.outputs.product }}'
          $reason = '${{ needs.protected-check-route.outputs.reason }}'
          $head = '${{ needs.protected-check-route.outputs.head }}'
          $tree = '${{ needs.protected-check-route.outputs.tree }}'
          $diff = '${{ needs.protected-check-route.outputs.diff_sha256 }}'
          if ($head -ne $env:EXPECTED_ROUTE_HEAD) { throw "protected-check head mismatch" }
          if ($tree -notmatch '^[0-9a-f]{40}$') { throw "protected-check tree malformed" }
          if ($diff -notmatch '^[0-9a-f]{64}$') { throw "protected-check diff digest malformed" }
          if ($route -eq 'false' -and $reason -ne 'EXPLICIT_NA_PROVIDER_CONTROL_ONLY') {
            throw "product N/A lacks the exact provider-only reason"
          }
          if ($route -eq 'true' -and $reason -notin @('ROUTER_CONTROL_CHANGED_RUN_REAL_ORACLES', 'UNKNOWN_OR_PRODUCT_PATH_RUN_REAL_ORACLES', 'MANUAL_DISPATCH_RUN_REAL_ORACLES')) {
            throw "product run lacks a recognized fail-closed reason"
          }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ env.EXPECTED_ROUTE_HEAD }}

      - name: Verify exact product checkout binding
        run: |
          $actualHead = (git rev-parse HEAD).Trim()
          $actualTree = (git rev-parse 'HEAD^{tree}').Trim()
          $expectedTree = '${{ needs.protected-check-route.outputs.tree }}'
          if ($actualHead -ne $env:EXPECTED_ROUTE_HEAD) { throw "product checkout head mismatch" }
          if ($actualTree -ne $expectedTree) { throw "product checkout tree mismatch" }

      - name: Test screenshot fresh-render provenance gate
        if: needs.protected-check-route.outputs.product == 'true'
        run: |
          & tools\profiling\test-gui-smoke-screenshot-provenance.ps1

      - name: Test color-artifact scan capture-invalid contract
        if: needs.protected-check-route.outputs.product == 'true'
        run: |
          & tools\profiling\test-gui-smoke-color-artifact-scan.ps1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Record explicit product-oracle N/A
        if: needs.protected-check-route.outputs.product == 'false'
        run: |
          Write-Output "Windows Product Oracles: explicit N/A for exact non-product diff"
          Write-Output "head=${{ needs.protected-check-route.outputs.head }}"
          Write-Output "tree=${{ needs.protected-check-route.outputs.tree }}"
          Write-Output "diffSha256=${{ needs.protected-check-route.outputs.diff_sha256 }}"
          Write-Output "reason=${{ needs.protected-check-route.outputs.reason }}"

      - name: Install aqtinstall
        if: needs.protected-check-route.outputs.product == 'true'
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/pip.txt
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/aqtinstall.txt
          python -m pip check

      - name: Install Qt 6.10.2 + MinGW 13.1
        if: needs.protected-check-route.outputs.product == 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $qtInstallRoot = Join-Path $env:QT_OUTPUT_DIR $env:QT_VERSION
          $qtRoot = Join-Path $qtInstallRoot "mingw_64"
          $qtQmake = Join-Path $qtRoot "bin\qmake.exe"
          $qtReady = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path -LiteralPath $qtInstallRoot) { Remove-Item -LiteralPath $qtInstallRoot -Recurse -Force -ErrorAction Stop }
            if (Test-Path -LiteralPath $qtInstallRoot) { throw "Qt retry cleanup did not remove $qtInstallRoot" }
            python -m aqt install-qt --outputdir "$env:QT_OUTPUT_DIR" windows desktop "$env:QT_VERSION" win64_mingw
            $qtExit = $LASTEXITCODE
            if ($qtExit -eq 0 -and (Test-Path -LiteralPath $qtQmake -PathType Leaf)) { $qtReady = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $qtReady) { throw "aqt Qt install failed or qmake.exe is missing after 3 attempts (exit=$qtExit)" }

          $mingwRoot = Join-Path $env:QT_OUTPUT_DIR "Tools\mingw1310_64"
          $mingwMake = Join-Path $mingwRoot "bin\mingw32-make.exe"
          $mingwGxx = Join-Path $mingwRoot "bin\g++.exe"
          $mingwReady = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path -LiteralPath $mingwRoot) { Remove-Item -LiteralPath $mingwRoot -Recurse -Force -ErrorAction Stop }
            if (Test-Path -LiteralPath $mingwRoot) { throw "MinGW retry cleanup did not remove $mingwRoot" }
            python -m aqt install-tool --outputdir "$env:QT_OUTPUT_DIR" windows desktop tools_mingw1310 qt.tools.win64_mingw1310
            $mingwExit = $LASTEXITCODE
            if ($mingwExit -eq 0 -and (Test-Path -LiteralPath $mingwMake -PathType Leaf) -and (Test-Path -LiteralPath $mingwGxx -PathType Leaf)) { $mingwReady = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $mingwReady) { throw "aqt MinGW install failed or required tools are missing after 3 attempts (exit=$mingwExit)" }
          Add-Content -Path $env:GITHUB_ENV -Value "QT_ROOT_DIR=$qtRoot"
          Add-Content -Path $env:GITHUB_ENV -Value "MINGW_ROOT=$mingwRoot"

      - name: Build console_tests
        if: needs.protected-check-route.outputs.product == 'true'
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:MINGW_ROOT\bin;$env:PATH"
          New-Item -ItemType Directory -Force tests\build-ci-console | Out-Null
          Push-Location tests\build-ci-console
          & "$env:QT_ROOT_DIR\bin\qmake.exe" "..\console\console_tests.pro"
          & "$env:MINGW_ROOT\bin\mingw32-make.exe" -j2
          Pop-Location

      - name: Run console_tests --check-golden
        if: needs.protected-check-route.outputs.product == 'true'
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:MINGW_ROOT\bin;$env:PATH"
          & "tests\build-ci-console\release\console_tests.exe" --check-golden

      - name: Build pipeline_tests
        if: needs.protected-check-route.outputs.product == 'true'
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:MINGW_ROOT\bin;$env:PATH"
          New-Item -ItemType Directory -Force tests\build-ci-pipeline | Out-Null
          Push-Location tests\build-ci-pipeline
          & "$env:QT_ROOT_DIR\bin\qmake.exe" "..\pipeline\pipeline_tests.pro"
          & "$env:MINGW_ROOT\bin\mingw32-make.exe" -j2
          Pop-Location

      - name: Run pipeline_tests --check-golden (bounded shards)
        if: needs.protected-check-route.outputs.product == 'true'
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:MINGW_ROOT\bin;$env:PATH"
          $env:MLVAPP_CRASH_FORENSICS_AUTOINSTALL = "1"
          $env:MLVAPP_CRASH_FORENSICS_LOG_DIR = Join-Path $env:RUNNER_TEMP "pipeline-crash-forensics"
          New-Item -ItemType Directory -Force $env:MLVAPP_CRASH_FORENSICS_LOG_DIR | Out-Null
          $suiteOutput = Join-Path $env:RUNNER_TEMP "pipeline-tests-output.txt"
          New-Item -ItemType File -Force $suiteOutput | Out-Null
          # Build deterministic exact-name shards from the source registry.
          # The former suite-wide shard could exceed the 300-second venue bound
          # and hide failures behind the timeout. Exact names keep every test
          # covered while bounding each child independently.
          $testNames = @(
            foreach ($file in Get-ChildItem tests\pipeline -Filter *.cpp) {
              $text = Get-Content -LiteralPath $file.FullName -Raw
              foreach ($match in [regex]::Matches($text, 'TEST(?:_[FP])?\(\s*([A-Za-z0-9_]+)\s*,\s*([A-Za-z0-9_]+)')) {
                "{0}.{1}" -f $match.Groups[1].Value.Trim(), $match.Groups[2].Value.Trim()
              }
            }
          ) | Sort-Object -Unique
          if ($testNames.Count -eq 0) { throw "pipeline test registry discovery returned no tests" }
          $testsPerShard = 12
          $shards = @()
          for ($offset = 0; $offset -lt $testNames.Count; $offset += $testsPerShard) {
            $end = [Math]::Min($offset + $testsPerShard, $testNames.Count)
            $filter = ($testNames[$offset..($end - 1)] -join ':')
            $shards += @{ Name = ("exact-{0:D2}" -f [int]($offset / $testsPerShard)); Filter = $filter }
          }
          function Invoke-BoundedPipelineShard {
            param(
              [string]$Name,
              [string[]]$Arguments,
              [string]$OutputPath,
              [int]$WaitMilliseconds = 240000
            )
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = (Resolve-Path "tests\build-ci-pipeline\release\pipeline_tests.exe").Path
            $psi.WorkingDirectory = $env:GITHUB_WORKSPACE
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            foreach ($argument in $Arguments) {
              [void]$psi.ArgumentList.Add($argument)
            }
            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $psi
            if (-not $process.Start()) { throw "failed to start pipeline shard $Name" }
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            $timedOut = -not $process.WaitForExit($WaitMilliseconds)
            if ($timedOut) {
              try { $process.Kill($true) } catch { }
            }
            $process.WaitForExit()
            $stdout = $stdoutTask.GetAwaiter().GetResult()
            $stderr = $stderrTask.GetAwaiter().GetResult()
            $combined = $stdout + $stderr
            Set-Content -Path $OutputPath -Value $combined -Encoding utf8
            return [pscustomobject]@{
              ExitCode = if ($timedOut) { 124 } else { $process.ExitCode }
              Output = $combined
              TimedOut = $timedOut
            }
          }
          foreach ($shard in $shards) {
            $shardOutput = Join-Path $env:RUNNER_TEMP ("pipeline-tests-{0}.txt" -f $shard.Name)
            Add-Content -Path $suiteOutput -Value ("===== SHARD {0} FILTER {1} =====" -f $shard.Name, $shard.Filter)
            $shardResult = Invoke-BoundedPipelineShard -Name $shard.Name -Arguments @("--gtest_filter=$($shard.Filter)") -OutputPath $shardOutput
            Add-Content -Path $suiteOutput -Value ("===== SHARD {0} FILTER {1} EXIT {2} =====" -f $shard.Name, $shard.Filter, $shardResult.ExitCode)
            Add-Content -Path $suiteOutput -Value $shardResult.Output
            Write-Output ("===== SHARD {0} FILTER {1} EXIT {2} =====" -f $shard.Name, $shard.Filter, $shardResult.ExitCode)
            Write-Output $shardResult.Output
            $shardExit = $shardResult.ExitCode

            if ($shardResult.TimedOut) {
              throw "pipeline_tests shard $($shard.Name) exceeded 240 seconds (exit 124; output retained)"
            }
            # Exit 1 means named test failures, which the reviewed manifest
            # adjudicates after all shards. Crashes and usage errors remain
            # unconditionally blocking. Golden comparison is deliberately not
            # performed on partial shard actuals; one complete producer job below
            # owns that contract.
            if ($shardExit -notin @(0, 1)) {
              throw "pipeline_tests shard $($shard.Name) failed outside the expected-failure contract (exit $shardExit)"
            }
          }

          # Golden disposition B: one complete producer-only process owns the
          # fail-closed report-all comparison. The reviewable key-to-test map is
          # checked against the committed artifact before the filter is derived,
          # so a key or producer cannot silently fall out of coverage.
          $goldenKeyToProducer = [ordered]@{
            'tiny_dual_iso.debayer.amaze.cpu.frame0' = 'BackendParametricDebayerShell.CpuRenderDebayerAmazeProducesStableHash'
            'tiny_dual_iso.debayer.bilinear.cpu.frame0' = 'BackendParametricDebayerShell.CpuRenderDebayerBilinearProducesStableHash'
            'tiny_dual_iso.full16.frame0' = 'DualIsoPipeline.TinyDualIsoFullFramesMatchGolden'
            'tiny_dual_iso.full16.frame1' = 'DualIsoPipeline.TinyDualIsoFullFramesMatchGolden'
            'tiny_dual_iso.gpu_preview_subset.exposure_0_75.frame0' = 'GpuPreviewProcessing.ExposureStopsChangesSubsetConfigAndStableOutput'
            'tiny_dual_iso.gpu_preview_subset.exposure_0_75.signature.frame0' = 'GpuPreviewProcessing.ExposureStopsChangesSubsetConfigAndStableOutput'
            'tiny_dual_iso.gpu_preview_subset.frame0' = 'GpuPreviewProcessing.TinyDualIsoReceiptSubsetGoldenOutputIsStable'
            'tiny_dual_iso.gpu_preview_subset.frame1' = 'GpuPreviewProcessing.TinyDualIsoReceiptSubsetGoldenOutputIsStable'
            'tiny_dual_iso.gpu_preview_subset.signature.frame0' = 'GpuPreviewProcessing.TinyDualIsoReceiptSubsetGoldenOutputIsStable'
            'tiny_dual_iso.gpu_preview_subset.signature.frame1' = 'GpuPreviewProcessing.TinyDualIsoReceiptSubsetGoldenOutputIsStable'
            'tiny_dual_iso.preview16.frame0' = 'DualIsoPipeline.TinyDualIsoPreviewFramesMatchGoldenAndStayCloseToFull'
            'tiny_dual_iso.preview16.frame1' = 'DualIsoPipeline.TinyDualIsoPreviewFramesMatchGoldenAndStayCloseToFull'
            'tiny_dual_iso.preview16_vs_full_psnr.frame0' = 'DualIsoPipeline.TinyDualIsoPreviewFramesMatchGoldenAndStayCloseToFull'
            'tiny_dual_iso.preview16_vs_full_psnr.frame1' = 'DualIsoPipeline.TinyDualIsoPreviewFramesMatchGoldenAndStayCloseToFull'
            'tiny_dual_iso.preview_processing.cpu.frame0' = 'BackendParametricShell.CpuRenderPreviewProcessingSubsetProducesStableHash'
          }
          $goldenPath = (Resolve-Path 'tests\fixtures\golden\pipeline_hashes.json').Path
          $goldenExpected = Get-Content -LiteralPath $goldenPath -Raw | ConvertFrom-Json -AsHashtable
          $expectedGoldenKeys = @($goldenExpected.Keys | Sort-Object)
          $mappedGoldenKeys = @($goldenKeyToProducer.Keys | Sort-Object)
          $mappingDelta = @(Compare-Object -ReferenceObject $expectedGoldenKeys -DifferenceObject $mappedGoldenKeys)
          if ($mappingDelta.Count -ne 0) {
            throw "golden key-to-producer coverage mismatch: $($mappingDelta | Out-String)"
          }
          $goldenProducerTests = @($goldenKeyToProducer.Values | Sort-Object -Unique)
          if ($goldenProducerTests.Count -ne 7) {
            throw "golden producer count changed: expected 7, actual $($goldenProducerTests.Count)"
          }
          $goldenProducerFilter = $goldenProducerTests -join ':'
          $goldenOutput = Join-Path $env:RUNNER_TEMP 'pipeline-tests-golden-producers.txt'
          $goldenActualOutput = Join-Path $env:RUNNER_TEMP 'pipeline-golden-actual.json'
          $goldenResult = Invoke-BoundedPipelineShard -Name 'golden-producers' -Arguments @(
            '--check-golden',
            '--hash-output', $goldenActualOutput,
            "--gtest_filter=$goldenProducerFilter"
          ) -OutputPath $goldenOutput
          Add-Content -Path $suiteOutput -Value ("===== GOLDEN PRODUCERS FILTER {0} EXIT {1} =====" -f $goldenProducerFilter, $goldenResult.ExitCode)
          Add-Content -Path $suiteOutput -Value $goldenResult.Output
          Write-Output ("===== GOLDEN PRODUCERS FILTER {0} EXIT {1} =====" -f $goldenProducerFilter, $goldenResult.ExitCode)
          Write-Output $goldenResult.Output
          if ($goldenResult.TimedOut) {
            throw 'pipeline golden producer job exceeded 240 seconds (exit 124; output retained)'
          }
          switch ($goldenResult.ExitCode) {
            0 { }
            2 { throw 'pipeline golden producer job could not write its actual-key artifact (exit 2)' }
            3 { throw 'pipeline golden producer job found a missing key, mismatch, or unexpected key (exit 3)' }
            5 { throw 'pipeline golden producer job refused a dirty or unverifiable oracle (exit 5)' }
            default { throw "pipeline golden producer job failed outside the golden contract (exit $($goldenResult.ExitCode))" }
          }

          # Criterion (v): exercise the hosted-like contention that exposed the
          # AggressiveX family under contention. Historical contended incidence
          # was 2/72 at 24-way load: N=107 gives about 95% point-estimate
          # detection power, while its 95% Clopper-Pearson lower bound (0.00338)
          # would require N=885. Hosted CI deliberately runs a lower-cost N=24
          # (four separately launched six-way batches): about 49.1% power at the
          # point estimate and 7.8% at that lower bound. Because six-way hosted
          # load is a different stratum from the historical 24-way evidence and
          # siblings in one batch may be correlated, this leg is a blocking
          # regression signal at disclosed power, never a 95% acceptance claim.
          $stressFilter = 'ProcessingFilters.AggressiveX*'
          $stressBatchCount = 4
          $stressBatchSize = 6
          $stressPlannedAttempts = $stressBatchCount * $stressBatchSize
          $stressAchievedAttempts = 0
          $powerDisclosure = 'STRESS-PREREG targetPower=95% historicalContendedRate=2/72 historicalLoad=24-way derivedN=107 cp95Lower=0.0033819 lowerBoundN=885 ciLoad=6-way ciN=24 pointPower=49.1% lowerBoundPower=7.8% dependence=within-batch-correlated'
          Add-Content -Path $suiteOutput -Value $powerDisclosure
          Write-Output $powerDisclosure
          for ($batch = 1; $batch -le $stressBatchCount; $batch++) {
            $stressProcesses = @()
            for ($run = 1; $run -le $stressBatchSize; $run++) {
              $attempt = (($batch - 1) * $stressBatchSize) + $run
              $name = "stress-b{0:D2}-r{1:D2}-a{2:D3}" -f $batch, $run, $attempt
              $psi = [System.Diagnostics.ProcessStartInfo]::new()
              $psi.FileName = (Resolve-Path "tests\build-ci-pipeline\release\pipeline_tests.exe").Path
              $psi.WorkingDirectory = $env:GITHUB_WORKSPACE
              $psi.UseShellExecute = $false
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError = $true
              [void]$psi.ArgumentList.Add("--gtest_filter=$stressFilter")
              $process = [System.Diagnostics.Process]::new()
              $process.StartInfo = $psi
              if (-not $process.Start()) { throw "failed to start stress repetition $name" }
              $stressProcesses += [pscustomobject]@{
                Name = $name
                Process = $process
                Stdout = $process.StandardOutput.ReadToEndAsync()
                Stderr = $process.StandardError.ReadToEndAsync()
              }
            }

            $batchFailures = @()
            foreach ($stress in $stressProcesses) {
              $timedOut = -not $stress.Process.WaitForExit(240000)
              if ($timedOut) {
                try { $stress.Process.Kill($true) } catch { }
              }
              $stress.Process.WaitForExit()
              $stressOutput = $stress.Stdout.GetAwaiter().GetResult() + $stress.Stderr.GetAwaiter().GetResult()
              $stressExit = if ($timedOut) { 124 } else { $stress.Process.ExitCode }
              $stressOutputPath = Join-Path $env:RUNNER_TEMP ("pipeline-tests-{0}.txt" -f $stress.Name)
              Set-Content -Path $stressOutputPath -Value $stressOutput -Encoding utf8
              Add-Content -Path $suiteOutput -Value ("===== STRESS {0} FILTER {1} EXIT {2} =====" -f $stress.Name, $stressFilter, $stressExit)
              Add-Content -Path $suiteOutput -Value $stressOutput
              Write-Output ("===== STRESS {0} FILTER {1} EXIT {2} =====" -f $stress.Name, $stressFilter, $stressExit)
              Write-Output $stressOutput
              $stressAchievedAttempts++
              if ($stressExit -ne 0) {
                $batchFailures += "$($stress.Name):$stressExit"
              }
            }
            if ($batchFailures.Count -ne 0) {
              $abort = "STRESS-ABORT achieved=$stressAchievedAttempts planned=$stressPlannedAttempts failures=$($batchFailures -join ',')"
              Add-Content -Path $suiteOutput -Value $abort
              throw $abort
            }
          }
          $stressComplete = "STRESS-COMPLETE achieved=$stressAchievedAttempts planned=$stressPlannedAttempts failures=0"
          Add-Content -Path $suiteOutput -Value $stressComplete
          Write-Output $stressComplete

          & tools\testing\check-expected-failures.ps1 -SuiteOutput $suiteOutput
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload pipeline crash forensics
        if: always() && needs.protected-check-route.outputs.product == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-product-oracles-pipeline-crash-forensics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}\pipeline-crash-forensics\**
            ${{ runner.temp }}\pipeline-tests-output.txt
            ${{ runner.temp }}\pipeline-tests-*.txt
            ${{ runner.temp }}\pipeline-golden-actual.json

  windows-gui-pilot:
    name: Windows GUI Pilot
    needs: protected-check-route
    if: ${{ always() && !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

    env:
      QT_VERSION: 6.10.2
      QT_OUTPUT_DIR: ${{ github.workspace }}\qt
      EXPECTED_ROUTE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Fail closed on unavailable GUI route
        if: ${{ needs.protected-check-route.result != 'success' || (needs.protected-check-route.outputs.gui != 'true' && needs.protected-check-route.outputs.gui != 'false') }}
        run: |
          throw "protected-check route unavailable or GUI output malformed"

      - name: Validate exact GUI route binding
        run: |
          $route = '${{ needs.protected-check-route.outputs.gui }}'
          $reason = '${{ needs.protected-check-route.outputs.reason }}'
          $head = '${{ needs.protected-check-route.outputs.head }}'
          $tree = '${{ needs.protected-check-route.outputs.tree }}'
          $diff = '${{ needs.protected-check-route.outputs.diff_sha256 }}'
          if ($head -ne $env:EXPECTED_ROUTE_HEAD) { throw "protected-check head mismatch" }
          if ($tree -notmatch '^[0-9a-f]{40}$') { throw "protected-check tree malformed" }
          if ($diff -notmatch '^[0-9a-f]{64}$') { throw "protected-check diff digest malformed" }
          if ($route -eq 'false' -and $reason -ne 'EXPLICIT_NA_PROVIDER_CONTROL_ONLY') {
            throw "GUI N/A lacks the exact provider-only reason"
          }
          if ($route -eq 'true' -and $reason -notin @('ROUTER_CONTROL_CHANGED_RUN_REAL_ORACLES', 'UNKNOWN_OR_PRODUCT_PATH_RUN_REAL_ORACLES', 'MANUAL_DISPATCH_RUN_REAL_ORACLES')) {
            throw "GUI run lacks a recognized fail-closed reason"
          }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ env.EXPECTED_ROUTE_HEAD }}

      - name: Verify exact GUI checkout binding
        run: |
          $actualHead = (git rev-parse HEAD).Trim()
          $actualTree = (git rev-parse 'HEAD^{tree}').Trim()
          $expectedTree = '${{ needs.protected-check-route.outputs.tree }}'
          if ($actualHead -ne $env:EXPECTED_ROUTE_HEAD) { throw "GUI checkout head mismatch" }
          if ($actualTree -ne $expectedTree) { throw "GUI checkout tree mismatch" }

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Record explicit GUI-pilot N/A
        if: needs.protected-check-route.outputs.gui == 'false'
        run: |
          Write-Output "Windows GUI Pilot: explicit N/A for exact non-product diff"
          Write-Output "head=${{ needs.protected-check-route.outputs.head }}"
          Write-Output "tree=${{ needs.protected-check-route.outputs.tree }}"
          Write-Output "diffSha256=${{ needs.protected-check-route.outputs.diff_sha256 }}"
          Write-Output "reason=${{ needs.protected-check-route.outputs.reason }}"

      - name: Install aqtinstall
        if: needs.protected-check-route.outputs.gui == 'true'
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/pip.txt
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/aqtinstall.txt
          python -m pip check

      - name: Install Qt 6.10.2 + MinGW 13.1
        if: needs.protected-check-route.outputs.gui == 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $qtInstallRoot = Join-Path $env:QT_OUTPUT_DIR $env:QT_VERSION
          $qtRoot = Join-Path $qtInstallRoot "mingw_64"
          $qtQmake = Join-Path $qtRoot "bin\qmake.exe"
          $qtReady = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path -LiteralPath $qtInstallRoot) { Remove-Item -LiteralPath $qtInstallRoot -Recurse -Force -ErrorAction Stop }
            if (Test-Path -LiteralPath $qtInstallRoot) { throw "Qt retry cleanup did not remove $qtInstallRoot" }
            python -m aqt install-qt --outputdir "$env:QT_OUTPUT_DIR" windows desktop "$env:QT_VERSION" win64_mingw
            $qtExit = $LASTEXITCODE
            if ($qtExit -eq 0 -and (Test-Path -LiteralPath $qtQmake -PathType Leaf)) { $qtReady = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $qtReady) { throw "aqt Qt install failed or qmake.exe is missing after 3 attempts (exit=$qtExit)" }

          $mingwRoot = Join-Path $env:QT_OUTPUT_DIR "Tools\mingw1310_64"
          $mingwMake = Join-Path $mingwRoot "bin\mingw32-make.exe"
          $mingwGxx = Join-Path $mingwRoot "bin\g++.exe"
          $mingwReady = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path -LiteralPath $mingwRoot) { Remove-Item -LiteralPath $mingwRoot -Recurse -Force -ErrorAction Stop }
            if (Test-Path -LiteralPath $mingwRoot) { throw "MinGW retry cleanup did not remove $mingwRoot" }
            python -m aqt install-tool --outputdir "$env:QT_OUTPUT_DIR" windows desktop tools_mingw1310 qt.tools.win64_mingw1310
            $mingwExit = $LASTEXITCODE
            if ($mingwExit -eq 0 -and (Test-Path -LiteralPath $mingwMake -PathType Leaf) -and (Test-Path -LiteralPath $mingwGxx -PathType Leaf)) { $mingwReady = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $mingwReady) { throw "aqt MinGW install failed or required tools are missing after 3 attempts (exit=$mingwExit)" }
          Add-Content -Path $env:GITHUB_ENV -Value "QT_ROOT_DIR=$qtRoot"
          Add-Content -Path $env:GITHUB_ENV -Value "MINGW_ROOT=$mingwRoot"

      - name: Build gui_tests
        if: needs.protected-check-route.outputs.gui == 'true'
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:MINGW_ROOT\bin;$env:PATH"
          New-Item -ItemType Directory -Force tests\build-ci-gui | Out-Null
          Push-Location tests\build-ci-gui
          & "$env:QT_ROOT_DIR\bin\qmake.exe" "..\gui\gui_tests.pro"
          & "$env:MINGW_ROOT\bin\mingw32-make.exe" -j2
          Pop-Location

      - name: Run gui_tests (offscreen)
        if: needs.protected-check-route.outputs.gui == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: desktop
          QT_QPA_PLATFORM_PLUGIN_PATH: ${{ env.QT_ROOT_DIR }}\plugins\platforms
          QT_PLUGIN_PATH: ${{ env.QT_ROOT_DIR }}\plugins
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:MINGW_ROOT\bin;$env:PATH"
          & "tests\build-ci-gui\release\gui_tests.exe" -o gui_tests_output.txt,txt
          $ec = $LASTEXITCODE
          Get-Content gui_tests_output.txt
          if ($ec -ne 0) { exit $ec }

      - name: Upload gui_tests log on failure
        if: failure() && needs.protected-check-route.outputs.gui == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui_tests_output
          path: gui_tests_output.txt
          if-no-files-found: ignore

  batch-compile:
    name: Batch Compile
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

    env:
      QT_VERSION: 6.10.2
      QT_OUTPUT_DIR: ${{ github.workspace }}\qt

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Install aqtinstall
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/pip.txt
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/aqtinstall.txt
          python -m pip check

      - name: Install Qt 6.10.2 + MinGW 13.1
        run: |
          $ErrorActionPreference = "Stop"
          $qtInstallRoot = Join-Path $env:QT_OUTPUT_DIR $env:QT_VERSION
          $qtRoot = Join-Path $qtInstallRoot "mingw_64"
          $qtQmake = Join-Path $qtRoot "bin\qmake.exe"
          $qtReady = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path -LiteralPath $qtInstallRoot) { Remove-Item -LiteralPath $qtInstallRoot -Recurse -Force -ErrorAction Stop }
            if (Test-Path -LiteralPath $qtInstallRoot) { throw "Qt retry cleanup did not remove $qtInstallRoot" }
            python -m aqt install-qt --outputdir "$env:QT_OUTPUT_DIR" windows desktop "$env:QT_VERSION" win64_mingw -m qtmultimedia
            $qtExit = $LASTEXITCODE
            if ($qtExit -eq 0 -and (Test-Path -LiteralPath $qtQmake -PathType Leaf)) { $qtReady = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $qtReady) { throw "aqt Qt install failed or qmake.exe is missing after 3 attempts (exit=$qtExit)" }

          $mingwRoot = Join-Path $env:QT_OUTPUT_DIR "Tools\mingw1310_64"
          $mingwMake = Join-Path $mingwRoot "bin\mingw32-make.exe"
          $mingwGxx = Join-Path $mingwRoot "bin\g++.exe"
          $mingwReady = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path -LiteralPath $mingwRoot) { Remove-Item -LiteralPath $mingwRoot -Recurse -Force -ErrorAction Stop }
            if (Test-Path -LiteralPath $mingwRoot) { throw "MinGW retry cleanup did not remove $mingwRoot" }
            python -m aqt install-tool --outputdir "$env:QT_OUTPUT_DIR" windows desktop tools_mingw1310 qt.tools.win64_mingw1310
            $mingwExit = $LASTEXITCODE
            if ($mingwExit -eq 0 -and (Test-Path -LiteralPath $mingwMake -PathType Leaf) -and (Test-Path -LiteralPath $mingwGxx -PathType Leaf)) { $mingwReady = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $mingwReady) { throw "aqt MinGW install failed or required tools are missing after 3 attempts (exit=$mingwExit)" }
          Add-Content -Path $env:GITHUB_ENV -Value "QT_ROOT_DIR=$qtRoot"
          Add-Content -Path $env:GITHUB_ENV -Value "MINGW_ROOT=$mingwRoot"

      - name: Build MLVApp
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:MINGW_ROOT\bin;$env:PATH"
          New-Item -ItemType Directory -Force platform\qt\build-ci-batch | Out-Null
          Push-Location platform\qt\build-ci-batch
          & "$env:QT_ROOT_DIR\bin\qmake.exe" "..\MLVApp.pro"
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "qmake failed for MLVApp.pro (exit=$LASTEXITCODE)" }
          & "$env:MINGW_ROOT\bin\mingw32-make.exe" -j2
          Pop-Location
