name: Windows Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DIR:   ${{ github.workspace }}\platform
  ARTIFACT:     ${{ github.workspace }}\platform\build\MLVApp\MLVApp.Win64.zip
  OPENSSL_BIN:  C:\Program Files\OpenSSL\bin
  QT_VERSION:   6.10.2

jobs:
  build:

    runs-on: windows-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false

    - name: Set up Python for payload verification
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version-file: ".python-version"

    - name: Install hash-locked Python dependencies
      timeout-minutes: 15
      shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
      run: |
        python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/pip.txt
        python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/repo-hygiene.txt
        python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r .github/requirements/aqtinstall.txt
        python -m pip check

    - name: Verify vendored native payload integrity
      run: python -m tools.repo_hygiene.vendored_native_payloads --repo-root . --require-target-compatible windows-x86_64

    - name: Install OpenSSL
      timeout-minutes: 15
      run: |
           choco install openssl --yes --no-progress --limit-output --execution-timeout=600
           if ($LASTEXITCODE -ne 0) { throw "Chocolatey OpenSSL install failed with exit code $LASTEXITCODE" }

    - name: Install Qt 6.10.2 + MinGW 13.1
      working-directory: ${{ runner.temp }}
      timeout-minutes: 20
      run: |
           $ErrorActionPreference = "Stop"
           $env:QT_OUTPUT_DIR = Join-Path $env:RUNNER_TEMP "mlv-release-qt"
           "QT_OUTPUT_DIR=$env:QT_OUTPUT_DIR" >> $env:GITHUB_ENV
           $qtInstallRoot = Join-Path $env:QT_OUTPUT_DIR $env:QT_VERSION
           $qtRoot = Join-Path $qtInstallRoot "mingw_64"
           $qtQmake = Join-Path $qtRoot "bin\qmake.exe"
           $qtReady = $false
           for ($attempt = 1; $attempt -le 3; $attempt++) {
             if (Test-Path -LiteralPath $qtInstallRoot) { Remove-Item -LiteralPath $qtInstallRoot -Recurse -Force -ErrorAction Stop }
             if (Test-Path -LiteralPath $qtInstallRoot) { throw "Qt retry cleanup did not remove $qtInstallRoot" }
             python -m aqt install-qt --outputdir "$env:QT_OUTPUT_DIR" windows desktop "$env:QT_VERSION" win64_mingw -m qtmultimedia
             $qtExit = $LASTEXITCODE
             if ($qtExit -eq 0 -and (Test-Path -LiteralPath $qtQmake -PathType Leaf)) { $qtReady = $true; break }
             if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
           }
           if (-not $qtReady) { throw "aqt Qt install failed or qmake.exe is missing after 3 attempts (exit=$qtExit)" }

           $mingwRoot = Join-Path $env:QT_OUTPUT_DIR "Tools\mingw1310_64"
           $mingwMake = Join-Path $mingwRoot "bin\mingw32-make.exe"
           $mingwGxx = Join-Path $mingwRoot "bin\g++.exe"
           $mingwReady = $false
           for ($attempt = 1; $attempt -le 3; $attempt++) {
             if (Test-Path -LiteralPath $mingwRoot) { Remove-Item -LiteralPath $mingwRoot -Recurse -Force -ErrorAction Stop }
             if (Test-Path -LiteralPath $mingwRoot) { throw "MinGW retry cleanup did not remove $mingwRoot" }
             python -m aqt install-tool --outputdir "$env:QT_OUTPUT_DIR" windows desktop tools_mingw1310 qt.tools.win64_mingw1310
             $mingwExit = $LASTEXITCODE
             if ($mingwExit -eq 0 -and (Test-Path -LiteralPath $mingwMake -PathType Leaf) -and (Test-Path -LiteralPath $mingwGxx -PathType Leaf)) { $mingwReady = $true; break }
             if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
           }
           if (-not $mingwReady) { throw "aqt MinGW install failed or required tools are missing after 3 attempts (exit=$mingwExit)" }
           "QMAKE_EXE=$qtQmake" >> $env:GITHUB_ENV
           "WINDEPLOYQT_EXE=$(Join-Path $qtRoot 'bin\windeployqt.exe')" >> $env:GITHUB_ENV
           "MAKE_EXE=$mingwMake" >> $env:GITHUB_ENV
           "GXX_EXE=$mingwGxx" >> $env:GITHUB_ENV
           "MINGW_BIN=$(Join-Path $mingwRoot 'bin')" >> $env:GITHUB_ENV

    - name: Verify Windows build toolchain
      run: |
           $requiredExecutables = @(
             (Join-Path $env:OPENSSL_BIN "openssl.exe"),
             $env:QMAKE_EXE,
             $env:WINDEPLOYQT_EXE,
             $env:MAKE_EXE,
             $env:GXX_EXE
           )
           foreach ($executable in $requiredExecutables) {
             if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
               throw "Required release executable is missing: $executable"
             }
           }
           $cryptoDlls = @(Get-ChildItem -LiteralPath $env:OPENSSL_BIN -Filter "libcrypto*.dll" -File)
           $sslDlls = @(Get-ChildItem -LiteralPath $env:OPENSSL_BIN -Filter "libssl*.dll" -File)
           if ($cryptoDlls.Count -eq 0) { throw "No libcrypto DLL found in $env:OPENSSL_BIN" }
           if ($sslDlls.Count -eq 0) { throw "No libssl DLL found in $env:OPENSSL_BIN" }
           "OPENSSL_CRYPTO_DLLS=$($cryptoDlls.FullName -join ';')" >> $env:GITHUB_ENV
           "OPENSSL_SSL_DLLS=$($sslDlls.FullName -join ';')" >> $env:GITHUB_ENV
           & (Join-Path $env:OPENSSL_BIN "openssl.exe") version
           if ($LASTEXITCODE -ne 0) { throw "OpenSSL executable probe failed" }
           & $env:QMAKE_EXE -v
           if ($LASTEXITCODE -ne 0) { throw "qmake executable probe failed" }
           $qmakeBin = [IO.Path]::GetFullPath((Split-Path -Parent $env:QMAKE_EXE))
           $deployBin = [IO.Path]::GetFullPath((Split-Path -Parent $env:WINDEPLOYQT_EXE))
           if ($deployBin -ne $qmakeBin) {
             throw "windeployqt '$env:WINDEPLOYQT_EXE' is not beside verified qmake '$env:QMAKE_EXE'"
           }
           & $env:MAKE_EXE --version
           if ($LASTEXITCODE -ne 0) { throw "make executable probe failed" }
           & $env:GXX_EXE --version
           if ($LASTEXITCODE -ne 0) { throw "exact MinGW g++ executable probe failed" }
           $compilerVersion = (& $env:GXX_EXE -dumpfullversion -dumpversion).Trim()
           if ($LASTEXITCODE -ne 0 -or $compilerVersion -ne "13.1.0") {
             throw "MinGW compiler version mismatch: expected 13.1.0, observed '$compilerVersion'"
           }
           $compilerTarget = (& $env:GXX_EXE -dumpmachine).Trim()
           if ($LASTEXITCODE -ne 0 -or $compilerTarget -ne "x86_64-w64-mingw32") {
             throw "MinGW compiler target mismatch: expected x86_64-w64-mingw32, observed '$compilerTarget'"
           }
           $qtVersion = (& $env:QMAKE_EXE -query QT_VERSION).Trim()
           if ($LASTEXITCODE -ne 0 -or $qtVersion -ne "6.10.2") {
             throw "Qt version mismatch: expected 6.10.2, observed '$qtVersion'"
           }
           $makeBin = [IO.Path]::GetFullPath((Split-Path -Parent $env:MAKE_EXE))
           $configuredMingwBin = [IO.Path]::GetFullPath($env:MINGW_BIN)
           if ($makeBin -ne $configuredMingwBin) {
             throw "Configured MinGW bin '$configuredMingwBin' does not contain make '$makeBin'"
           }
           $expectedCompiler = [IO.Path]::GetFullPath((Join-Path $makeBin "g++.exe"))
           $configuredCompiler = [IO.Path]::GetFullPath($env:GXX_EXE)
           if ($configuredCompiler -ne $expectedCompiler) {
             throw "Configured g++ '$configuredCompiler' is not beside make '$env:MAKE_EXE'"
           }
           $env:PATH = "$makeBin;$env:PATH"
           $resolvedCompilers = @(Get-Command g++.exe -All -CommandType Application -ErrorAction Stop)
           if ($resolvedCompilers.Count -eq 0) { throw "No PATH-resolved g++.exe applications were found" }
           $canonicalCompilers = @($resolvedCompilers | ForEach-Object { [IO.Path]::GetFullPath($_.Source) })
           $actualCompiler = $canonicalCompilers[0]
           if ($actualCompiler -ne $expectedCompiler) {
             throw "Bare g++ resolves to '$actualCompiler', expected '$expectedCompiler'"
           }
           if (@($canonicalCompilers | Where-Object { $_ -eq $expectedCompiler }).Count -ne 1) {
             throw "Expected compiler '$expectedCompiler' must appear exactly once in PATH resolution"
           }
           & g++.exe --version
           if ($LASTEXITCODE -ne 0) { throw "PATH-resolved MinGW g++ executable probe failed" }
           $makeBin >> $env:GITHUB_PATH

    - name: Create build directory
      run:  mkdir ${{ env.SOURCE_DIR }}\build

    - name: Build
      working-directory: ${{ env.SOURCE_DIR }}\build
      run:  |
            $ErrorActionPreference = "Stop"
            python "${{ github.workspace }}\tools\release\build_stamp.py" generate --repo-root "${{ github.workspace }}" --expected-sha "${{ github.sha }}" --output-header "${{ env.SOURCE_DIR }}\build\build_buildinfo.h"
            if ($LASTEXITCODE -ne 0) { throw "build stamp generation failed with exit code $LASTEXITCODE" }
            & $env:QMAKE_EXE -r "${{ env.SOURCE_DIR }}\qt\MLVApp.pro"
            if ($LASTEXITCODE -ne 0) { throw "qmake failed with exit code $LASTEXITCODE" }
            & $env:MAKE_EXE
            if ($LASTEXITCODE -ne 0) { throw "make failed with exit code $LASTEXITCODE" }
            python "${{ github.workspace }}\tools\release\build_stamp.py" verify --binary "${{ env.SOURCE_DIR }}\build\release\MLVApp.exe" --expected-sha "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) { throw "compiled build stamp verification failed with exit code $LASTEXITCODE" }
            Set-Location release
            & $env:WINDEPLOYQT_EXE MLVApp.exe
            if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }
            Copy-Item -LiteralPath (Join-Path $env:MINGW_BIN "libgomp-1.dll") -Destination .
            Copy-Item -LiteralPath (Join-Path $env:MINGW_BIN "libstdc++-6.dll") -Destination .
            Copy-Item -LiteralPath (Join-Path $env:MINGW_BIN "libwinpthread-1.dll") -Destination .
            Copy-Item -LiteralPath (Join-Path $env:MINGW_BIN "libgcc_s_seh-1.dll") -Destination .
            foreach ($dll in ($env:OPENSSL_CRYPTO_DLLS -split ';')) {
              Copy-Item -LiteralPath $dll -Destination .
            }
            foreach ($dll in ($env:OPENSSL_SSL_DLLS -split ';')) {
              Copy-Item -LiteralPath $dll -Destination .
            }
            Get-ChildItem

    - name: Install verified FFMPEG
      run:  |
            python -m tools.repo_hygiene.extract_vendored_native_payload --repo-root "${{ github.workspace }}" --payload-id ffmpeg-windows-x86_64 --archive-reference ffmpegWin64.zip --output-dir "${{ env.SOURCE_DIR }}\build\release" --verify-installed

    - name: Install verified RAW2MLV
      shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
      run:  |
            python -m tools.repo_hygiene.extract_vendored_native_payload --repo-root "${{ github.workspace }}" --payload-id raw2mlv-windows-x86-compat --archive-reference raw2mlvWin64.zip --output-dir "${{ env.SOURCE_DIR }}\build\release" --verify-installed
            dir ${{ env.SOURCE_DIR }}\build\release

    - name: Rename release folder
      working-directory: ${{ env.SOURCE_DIR }}\build
      run: |
           ren release MLVApp
           python "${{ github.workspace }}\tools\release\build_stamp.py" verify --binary "${{ env.SOURCE_DIR }}\build\MLVApp\MLVApp.exe" --expected-sha "${{ github.sha }}"
           if ($LASTEXITCODE -ne 0) { throw "packaged build stamp verification failed with exit code $LASTEXITCODE" }
           dir

    - name: Print toolchain
      shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
      run: |
           $qtVersion = (& $env:QMAKE_EXE -query QT_VERSION).Trim()
           $compilerVersion = (& $env:GXX_EXE -dumpfullversion -dumpversion).Trim()
           Write-Output "qmake QT_VERSION=$qtVersion"
           Write-Output "g++ version=$compilerVersion"
           if ($qtVersion -ne "6.10.2") { throw "Print toolchain: expected Qt 6.10.2, observed '$qtVersion'" }
           if ($compilerVersion -ne "13.1.0") { throw "Print toolchain: expected MinGW 13.1.0, observed '$compilerVersion'" }
           $toolchainLog = Join-Path $env:RUNNER_TEMP "toolchain-log.txt"
           @(
             "QT_VERSION=$qtVersion"
             "COMPILER_VERSION=$compilerVersion"
             "QMAKE_EXE=$env:QMAKE_EXE"
             "GXX_EXE=$env:GXX_EXE"
           ) | Set-Content -Path $toolchainLog -Encoding utf8
           "TOOLCHAIN_LOG=$toolchainLog" >> $env:GITHUB_ENV

    - name: Upload toolchain receipt
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: toolchain-receipt-${{ github.run_id }}
        path: ${{ env.TOOLCHAIN_LOG }}
        if-no-files-found: error

    - name: Generate single-build release evidence
      shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
      run: |
           $QmakePath = (Get-Command $env:QMAKE_EXE -CommandType Application -ErrorAction Stop).Source
           $CompilerPath = (Get-Command $env:GXX_EXE -CommandType Application -ErrorAction Stop).Source
           $DeployPath = (Get-Command $env:WINDEPLOYQT_EXE -CommandType Application -ErrorAction Stop).Source
           $QtVersion = & $QmakePath -query QT_VERSION
           $CompilerVersion = & $CompilerPath -dumpfullversion -dumpversion
           $CompilerTarget = & $CompilerPath -dumpmachine
           python -m tools.release.release_evidence `
             --repo-root "${{ github.workspace }}" `
             --product "${{ env.SOURCE_DIR }}\build\MLVApp" `
             --inventory-root "${{ env.SOURCE_DIR }}\build\MLVApp" `
             --expected-main "MLVApp.exe" `
             --output-dir "${{ runner.temp }}\release-evidence" `
             --label "windows-x86_64" `
             --target-os "windows" `
             --target-arch "x86_64" `
             --repository "${{ github.repository }}" `
             --source-ref "${{ github.ref }}" `
             --commit "${{ github.sha }}" `
             --run-id "${{ github.run_id }}" `
             --run-attempt "${{ github.run_attempt }}" `
             --runner-os "${{ runner.os }}" `
             --runner-arch "${{ runner.arch }}" `
             --runner-name "${{ runner.name }}" `
             --runner-image-os "$env:ImageOS" `
             --runner-image-version "$env:ImageVersion" `
             --tool "qmake=$QmakePath" `
             --tool "compiler=$CompilerPath" `
             --tool "windeployqt=$DeployPath" `
             --tool-version "qmake=$QtVersion" `
             --tool-version "compiler=$CompilerVersion|$CompilerTarget" `
             --tool-version "windeployqt=$QtVersion" `
             --enable-vendored-compatibility-admission

    - name: Save release evidence
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: MLVApp Windows 64bit release evidence
        path: ${{ runner.temp }}\release-evidence
        if-no-files-found: error

    - name: Save build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: MLVApp Windows 64bit
        path: ${{ env.SOURCE_DIR }}\build\MLVApp
        if-no-files-found: error
